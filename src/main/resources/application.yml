spring:
  application:
    name: fxbrief-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FxBriefHikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

fxbrief:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: fxbrief
      expiration-hours: 24
  auth:
    email-verification-ttl-hours: 24
    password-reset-ttl-minutes: 30
    bcrypt-strength: 12
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  account:
    deletion-grace-days: 30
  scheduler:
    hard-delete-cron: "0 15 22 * * *"
  rate-limit:
    window-seconds: 60
    endpoint-limits:
      "[/auth/login]": 5
      "[/auth/register]": 3
      "[/auth/forgot-password]": 3

logging:
  level:
    root: INFO
    com.fxbrief: INFO
    org.flywaydb: INFO
